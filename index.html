<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inonova – Dalsi Video Marketing</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:       #050508;
      --deep:        #0a0a15;
      --card:        #10101a;
      --border:      #2a2a45;
      --purple:      #8a2be2;
      --purple-lite: #b060f0;
      --red:         #ff1a35;
      --red-dark:    #c8001a;
      --white:       #ffffff;
      --muted:       #a0a0c0;
      --success:     #00ff88;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND ─── */
    .bg-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(138,43,226,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(138,43,226,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .bg-glow {
      position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(138,43,226,0.15) 0%, transparent 70%);
      top: -200px; left: -100px; border-radius: 50%;
    }

    /* ─── NAVBAR ─── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 80px;
      background: rgba(5,5,8,0.95);
      border-bottom: 2px solid var(--purple);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .logo-name {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 24px;
      color: var(--white); letter-spacing: 2px;
    }
    .logo-sub { font-size: 10px; color: var(--purple-lite); letter-spacing: 3px; text-transform: uppercase; display: block; }
    .nav-badge { padding: 8px 16px; background: var(--purple); border-radius: 4px; font-weight: 800; font-size: 12px; color: #fff; }

    /* ─── HERO SECTION ─── */
    .hero {
      position: relative; z-index: 10;
      text-align: center;
      padding: 80px 20px 40px;
      background: linear-gradient(to bottom, rgba(5,5,8,1) 0%, rgba(5,5,8,0) 100%);
    }
    .hero-eyebrow {
      color: var(--red); font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
      font-size: 14px; margin-bottom: 20px; display: block;
    }
    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 16px;
      color: var(--white);
    }
    .hero-title span { color: var(--red); display: block; }
    .hero-desc { font-size: 18px; color: var(--muted); max-width: 700px; margin: 0 auto; line-height: 1.6; }

    /* ─── MAIN LAYOUT ─── */
    .container { max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; position: relative; z-index: 10; }
    
    .card { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 40px; box-shadow: 15px 15px 0px var(--purple); margin-bottom: 60px; }
    .card-title { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 800; color: var(--white); margin-bottom: 30px; border-left: 4px solid var(--red); padding-left: 15px; }

    .form-label { display: block; font-weight: 800; color: var(--purple-lite); text-transform: uppercase; margin-bottom: 12px; font-size: 13px; }
    .form-input {
      width: 100%; padding: 18px; background: #000; border: 2px solid var(--border);
      color: #fff; font-size: 16px; outline: none; margin-bottom: 25px;
    }
    .form-input:focus { border-color: var(--purple); }

    .script-box { background: #000; border: 1px solid var(--border); padding: 20px; margin-bottom: 25px; }
    .script-text { font-family: monospace; line-height: 1.7; color: #ccc; font-size: 14px; }
    .highlight { color: var(--red); font-weight: 800; background: rgba(255,26,53,0.1); padding: 2px 4px; }

    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .form-select { width: 100%; padding: 15px; background: #000; border: 2px solid var(--border); color: #fff; cursor: pointer; }

    .btn-submit {
      width: 100%; padding: 22px; background: var(--red); color: #fff;
      font-size: 18px; font-weight: 900; border: none; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px; transition: 0.2s;
    }
    .btn-submit:hover { background: #fff; color: #000; }
    .btn-submit:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── JOBS TABLE ─── */
    .jobs-section { margin-top: 40px; }
    .table-wrap { width: 100%; overflow-x: auto; background: var(--card); border: 2px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
    th { background: rgba(138,43,226,0.15); color: var(--purple-lite); font-weight: 800; text-transform: uppercase; font-size: 12px; padding: 20px; border-bottom: 2px solid var(--border); }
    td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .status-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 12px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; }
    .status-pending { background: rgba(138,43,226,0.15); color: var(--purple-lite); }
    .status-complete { background: rgba(0,255,136,0.1); color: var(--success); }
    
    .btn-download-small { background: var(--red); color: #fff; padding: 8px 16px; font-weight: 800; text-decoration: none; font-size: 11px; text-transform: uppercase; border-radius: 2px; display: inline-block; }
    .btn-download-small:hover { background: #fff; color: #000; }

    /* ─── LOADERS ─── */
    .mini-loader { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--red); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .refresh-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; font-size: 12px; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .refresh-btn:hover { color: #fff; border-color: var(--purple); }

    @media (max-width: 600px) { .config-grid { grid-template-columns: 1fr; } .hero-title { font-size: 32px; } }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API_BASE = 'https://api.neodalsi.com';
const API_KEY = 'demo_key_123';

const SCRIPT_BASE = (name) => `Hi ${name}! Sharing exciting news from University of Bedfordshire. PG admissions are open for May and July intakes for Postgraduate courses like MSc Computer Science, MSc Cyber Security , or Project Management Data Analytics. 45% and 55% entry for degree course. For entry - Indian student minimum 70% in twelfth English. Scholarships up to five thousand Euros, 99% visa success rates, and PG accelerate option – perfect Options! Apply at beds.ac.uk asap! Your UK journey starts here! Thanks`;

const VOICE_OPTIONS = [
  { id: 'expr-voice-1-f', name: 'Female 1' },
  { id: 'expr-voice-2-m', name: 'Male 1' },
  { id: 'expr-voice-3-m', name: 'Male 2 (Default)' },
  { id: 'expr-voice-4-f', name: 'Female 2' },
  { id: 'expr-voice-5-f', name: 'Female 3' },
  { id: 'expr-voice-6-m', name: 'Male 3' },
  { id: 'expr-voice-7-f', name: 'Female 4' },
  { id: 'expr-voice-8-m', name: 'Male 4' }
];

function App() {
  const [name, setName] = useState('');
  const [voice, setVoice] = useState('expr-voice-3-m');
  const [speed, setSpeed] = useState('1.3');
  const [generating, setGenerating] = useState(false);
  const [jobs, setJobs] = useState([]);
  const [fetching, setFetching] = useState(false);

  const fetchJobs = useCallback(async () => {
    setFetching(true);
    try {
      const res = await fetch(`${API_BASE}/videogen/jobs`, {
        headers: { 'X-API-KEY': API_KEY }
      });
      const data = await res.json();
      if (data && data.jobs) {
        setJobs(data.jobs);
      }
    } catch (err) {
      console.error("Failed to fetch jobs:", err);
    }
    setFetching(false);
  }, []);

  useEffect(() => {
    fetchJobs();
    const interval = setInterval(fetchJobs, 8000); // Poll every 8 seconds
    return () => clearInterval(interval);
  }, [fetchJobs]);

  const generate = async (e) => {
    e.preventDefault();
    setGenerating(true);
    try {
      const res = await fetch(`${API_BASE}/videogen/generate`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'X-API-KEY': API_KEY
        },
        body: JSON.stringify({
          student_name: name,
          script: SCRIPT_BASE(name),
          voice: voice,
          speed: parseFloat(speed)
        })
      });
      
      if (res.ok) {
        setName(''); // Reset form
        fetchJobs(); // Refresh list
      } else {
        const errData = await res.json();
        alert(`Error: ${errData.message || 'Failed to start job'}`);
      }
    } catch (err) {
      alert("Connection error. Is the API server accessible?");
    }
    setGenerating(false);
  };

  return (
    <div className="page">
      <div className="bg-wrap">
        <div className="bg-grid"></div>
        <div className="bg-glow"></div>
      </div>

      <nav className="navbar">
        <div>
          <span className="logo-name">INONOVA</span>
          <span className="logo-sub">Dalsi Video Marketing</span>
        </div>
        <div className="nav-badge">ADMIN CONSOLE</div>
      </nav>

      <header className="hero">
        <span className="hero-eyebrow">Production Environment</span>
        <h1 className="hero-title">
          VIDEO CAMPAIGN
          <span>GENERATOR</span>
        </h1>
        <p className="hero-desc">Launch personalized video marketing campaigns for your students in real-time.</p>
      </header>

      <div className="container">
        {/* GENERATOR CARD */}
        <div className="card">
          <h2 className="card-title">New Generation Request</h2>
          <form onSubmit={generate}>
            <label className="form-label">Student Name</label>
            <input 
              className="form-input" 
              placeholder="e.g. Ajay Kumar" 
              value={name} 
              onChange={e => setName(e.target.value)}
              required
            />

            <label className="form-label">Script Preview</label>
            <div className="script-box">
              <p className="script-text">
                {name ? (
                  <>Hi <span className="highlight">{name}</span>! {SCRIPT_BASE('').slice(3)}</>
                ) : (
                  "Enter a name to preview the personalized script..."
                )}
              </p>
            </div>

            <div className="config-grid">
              <div>
                <label className="form-label">Voice Selection</label>
                <select className="form-select" value={voice} onChange={e => setVoice(e.target.value)}>
                  {VOICE_OPTIONS.map(v => (
                    <option key={v.id} value={v.id}>{v.name}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="form-label">Speed</label>
                <select className="form-select" value={speed} onChange={e => setSpeed(e.target.value)}>
                  <option value="1.0">1.0x Normal</option>
                  <option value="1.2">1.2x Fast</option>
                  <option value="1.3">1.3x Brisk</option>
                  <option value="1.5">1.5x Very Fast</option>
                </select>
              </div>
            </div>

            <button className="btn-submit" disabled={!name || generating}>
              {generating ? "Submitting Request..." : "Start Generation Job"}
            </button>
          </form>
        </div>

        {/* JOBS HISTORY SECTION */}
        <div className="jobs-section">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
            <h2 className="card-title">Generation Jobs History</h2>
            <button className="refresh-btn" onClick={fetchJobs} disabled={fetching}>
              {fetching ? <div className="mini-loader"></div> : "↻"} Refresh List
            </button>
          </div>
          
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Voice</th>
                  <th>Started At</th>
                  <th>Status / Progress</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {jobs.length === 0 ? (
                  <tr>
                    <td colSpan="5" style={{textAlign:'center', padding:'40px', color: 'var(--muted)'}}>
                      No generation jobs found. Start your first campaign above!
                    </td>
                  </tr>
                ) : (
                  jobs.map(job => {
                    const isComplete = job.video_url === 'complete';
                    const downloadUrl = isComplete ? `${API_BASE}${job.filename}` : null;
                    
                    return (
                      <tr key={job.job_id}>
                        <td style={{fontWeight:'700'}}>{job.student_name}</td>
                        <td style={{color:'var(--muted)'}}>{job.voice}</td>
                        <td style={{fontSize:'12px'}}>{job.started_at}</td>
                        <td>
                          {isComplete ? (
                            <span className="status-badge status-complete">✓ Complete</span>
                          ) : (
                            <span className="status-badge status-pending">
                              <div className="mini-loader"></div>
                              Processing
                            </span>
                          )}
                        </td>
                        <td>
                          {isComplete ? (
                            <a href={downloadUrl} target="_blank" className="btn-download-small">Download MP4</a>
                          ) : (
                            <span style={{fontSize:'11px', color:'var(--muted)'}}>Please wait...</span>
                          )}
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <footer style={{textAlign:'center', padding:'40px', color:'var(--muted)', fontSize:'12px', borderTop:'1px solid var(--border)', marginTop:'40px'}}>
        &copy; 2026 Inonova &bull; Dalsi Video Marketing &bull; Powered by AI
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
